name: Daily data refresh

# Re-scrape Artificial Analysis + OpenRouter daily and publish the snapshot to
# the data branch installed skills fetch from; main ships code only. Also
# triggerable manually. Actions pinned to commit SHAs to close the
# floating-tag supply-chain vector.

on:
  schedule:
    - cron: "0 12 * * *"  # Every day at 12:00 UTC
  workflow_dispatch:

concurrency:
  group: daily-data-refresh
  cancel-in-progress: false

defaults:
  run:
    working-directory: skills/which-llm

permissions:
  contents: write
  issues: write  # for the failure-issue-opener step

env:
  DATA_BRANCH: automation/daily-data-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v4 (resolved 2026-05-23)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-python@v5 (resolved 2026-06-09)
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Install scraper dependencies
        run: python -m pip install cryptography pytest

      - name: Verify scraper resilience
        working-directory: ${{ github.workspace }}
        run: python -m pytest tests/which_llm -q

      - name: Restore last published data as refresh baseline
        working-directory: ${{ github.workspace }}
        run: |
          # No data branch yet means a first run: scrape without a baseline.
          if git fetch origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"; then
            for FILE in skills/which-llm/artifacts/models_enriched.csv skills/which-llm/artifacts/aa_data.json; do
              if git cat-file -e "origin/$DATA_BRANCH:$FILE"; then
                git restore --source "origin/$DATA_BRANCH" --worktree -- "$FILE"
              fi
            done
          fi

      - name: Refresh AA scrape
        run: python scrape.py --refresh

      - name: Refresh OpenRouter enrichment
        run: python enrich.py --refresh

      - name: Validate runtime snapshot
        run: |
          python -c "from data import validate_csv; from pathlib import Path; validate_csv(Path('artifacts/models_enriched.csv').read_text())"
          python pick.py best --top 3
          python data.py

      - name: Publish data commit if data changed
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The artifacts folder is gitignored on main, so force the add.
          git add -f skills/which-llm/artifacts/models_enriched.csv \
                     skills/which-llm/artifacts/aa_data.json \
                     skills/which-llm/artifacts/unmatched.txt
          PUBLISHED="refs/remotes/origin/$DATA_BRANCH"
          if git rev-parse -q --verify "$PUBLISHED" >/dev/null &&
             git diff --cached --quiet "$PUBLISHED" -- skills/which-llm/artifacts; then
            echo "No data changes; nothing to publish."
            exit 0
          fi
          git commit -m "refresh model data"
          git push --force-with-lease="refs/heads/$DATA_BRANCH" origin "HEAD:refs/heads/$DATA_BRANCH"

      - name: Open issue if any earlier step failed
        if: failure()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(cat <<EOF
          The daily refresh workflow failed.

          Run: $RUN_URL

          Likely causes:
          - Artificial Analysis changed the page structure (scrape.py parser broke)
          - Catastrophic-drop guard tripped (>20% fewer models parsed than the prior snapshot)
          - Transient network failure on AA or OpenRouter (re-running may succeed)
          - GH Actions runner / Python tooling issue

          Investigate the failed step's logs in the run above.
          EOF
          )
          # De-dupe: don't open a new issue if there's already one open for refresh failures.
          EXISTING=$(gh issue list --state open --search "Daily refresh failed in:title" --json number --jq '.[0].number' || echo "")
          if [[ -z "$EXISTING" ]]; then
            gh issue create \
              --title "Daily refresh failed $(date -u +%Y-%m-%d)" \
              --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "Another failure: $RUN_URL"
          fi
