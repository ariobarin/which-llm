name: Daily data refresh

# Re-scrape Artificial Analysis + OpenRouter daily so the snapshot shipped
# in the repo stays current. Also triggerable manually. Actions pinned to
# commit SHAs to close the floating-tag supply-chain vector.

on:
  schedule:
    - cron: "0 12 * * *"  # Every day at 12:00 UTC
  workflow_dispatch:

concurrency:
  group: daily-data-refresh
  cancel-in-progress: false

defaults:
  run:
    working-directory: skills/which-llm

permissions:
  contents: write
  issues: write  # for the failure-issue-opener step
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v4 (resolved 2026-05-23)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-python@v5 (resolved 2026-06-09)
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Install scraper dependencies
        run: python -m pip install .

      - name: Restore last published data as refresh baseline
        working-directory: ${{ github.workspace }}
        run: |
          if git fetch origin refs/heads/automation/daily-data-refresh; then
            for FILE in skills/which-llm/artifacts/models_enriched.csv skills/which-llm/artifacts/aa_data.json; do
              if git cat-file -e "FETCH_HEAD:$FILE"; then
                git restore --source FETCH_HEAD --worktree -- "$FILE"
              fi
            done
          fi

      - name: Refresh AA scrape
        run: python scrape.py --refresh

      - name: Refresh OpenRouter enrichment
        run: python enrich.py --refresh

      - name: Validate runtime snapshot
        run: |
          python -c "from data import validate_csv; from pathlib import Path; validate_csv(Path('artifacts/models_enriched.csv').read_text())"
          python pick.py best --top 3
          python data.py

      - name: Sync plugin wrapper
        working-directory: ${{ github.workspace }}
        run: python scripts/sync_plugin_wrapper.py

      - name: Open refresh PR if data changed
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain skills/which-llm/artifacts/ plugins/which-llm/skills/which-llm/artifacts/)" ]]; then
            REFRESH_BRANCH="automation/daily-data-refresh"
            git fetch origin "$REFRESH_BRANCH:refs/remotes/origin/$REFRESH_BRANCH" || true
            git switch -C "$REFRESH_BRANCH" "$GITHUB_SHA"
            git add skills/which-llm/artifacts/models_enriched.csv \
                    skills/which-llm/artifacts/aa_data.json \
                    skills/which-llm/artifacts/unmatched.txt \
                    plugins/which-llm/skills/which-llm/artifacts/models_enriched.csv \
                    plugins/which-llm/skills/which-llm/artifacts/aa_data.json \
                    plugins/which-llm/skills/which-llm/artifacts/unmatched.txt
            if git diff --cached --quiet; then
              echo "No artifact changes; nothing to commit."
              exit 0
            fi
            git commit -m "refresh model data"
            git push --force-with-lease=refs/heads/$REFRESH_BRANCH origin "HEAD:$REFRESH_BRANCH"
            EXISTING_PR=$(gh pr list --head "$REFRESH_BRANCH" --state open --json number --jq '.[0].number')
            if [[ -n "$EXISTING_PR" ]]; then
              gh pr edit "$EXISTING_PR" \
                --title "Refresh model data" \
                --body "Daily refresh found model catalog changes."
            else
              gh pr create \
                --base main \
                --head "$REFRESH_BRANCH" \
                --title "Refresh model data" \
                --body "Daily refresh found model catalog changes."
            fi
          else
            echo "No artifact changes; nothing to commit."
          fi

      - name: Open issue if any earlier step failed
        if: failure()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(cat <<EOF
          The daily refresh workflow failed.

          Run: $RUN_URL

          Likely causes:
          - Artificial Analysis changed the page structure (scrape.py parser broke)
          - Catastrophic-drop guard tripped (>20% fewer models parsed than the prior snapshot)
          - Transient network failure on AA or OpenRouter (re-running may succeed)
          - GH Actions runner / Python tooling issue

          Investigate the failed step's logs in the run above.
          EOF
          )
          # De-dupe: don't open a new issue if there's already one open for refresh failures.
          EXISTING=$(gh issue list --state open --search "Daily refresh failed in:title" --json number --jq '.[0].number' || echo "")
          if [[ -z "$EXISTING" ]]; then
            gh issue create \
              --title "Daily refresh failed $(date -u +%Y-%m-%d)" \
              --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "Another failure: $RUN_URL"
          fi
